# Kinbase acceptance instrument configuration.
# Lane rule: every dependency and the exact Validator invocation live beneath tests/.
# No shared packaging file at the repository root is read or edited by this suite.
[pytest]
testpaths = acceptance
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --durations=25
    -p no:cacheprovider
markers =
    v1: V-1 real heterogeneous corpus (verification.md acceptance map)
    v2: V-2 classification and fan-out
    v3: V-3 privacy and authority boundary (zero tolerance)
    v4: V-4 corpus maintenance and distributed conflicts
    v5: V-5 temporal discernment
    v6: V-6 real authority round trip
    v7: V-7 set-conditional projection and VOI stop
    v8: V-8 Company references from .kin/
    v9: V-9 real host lifecycle
    nonfunctional: verification.md "Nonfunctional proof gates"
    evidence: verification.md "Evidence packet"
    verdict: verification.md "Verdict semantics"
    control_positive: frozen positive control; a miss is INVALID_HARNESS
    control_negative: frozen negative control; a hit above tolerance is INVALID_HARNESS
    mutation: frozen mutation obligation; the named gate must fail under the mutation
    denial: ordering / authority denial probe that must refuse
    timing: latency or throughput measurement with a frozen budget
    soak: long-running repeated-session measurement
    selftest: instrument validity check that runs without the product
    requires_product: needs the combined Coder implementation entry point
    requires_hosts: needs real Codex and/or Claude executables in isolated homes
    slow: expected to exceed 60 seconds
log_cli = false
log_level = INFO
timeout = 3600
timeout_method = thread
